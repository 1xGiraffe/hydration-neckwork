# Shared micro-cache for API GETs. All /explorer responses are anonymous and the
# API stamps them with `public, max-age=…` (which nginx honors for entry
# lifetime), so N concurrent clients polling the same endpoint collapse to at
# most one upstream request per TTL — the API/ClickHouse load stays O(1) in the
# number of viewers even before the API's own in-process cache kicks in.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=200m inactive=15m use_temp_path=off;
# Forum images (/ipfs/<cid>): their own zone, never the API micro-cache. The bytes
# behind a CID never change, so an entry lives a day — not a year, because a
# moderator's removal (open-source nginx has no purge) must stop serving within a
# day here and in browsers alike.
proxy_cache_path /var/cache/nginx/ipfs levels=1:2 keys_zone=ipfs_cache:10m max_size=1g inactive=1d use_temp_path=off;

# Per-client brake on the explorer's EXPENSIVE reads — the uncached, per-request
# ClickHouse work: blocks, extrinsics, the activity/event feeds, holders, an
# account's history pages. On 2026-11-13 one scraper walking exactly these
# (~1.5 req/s for hours) held ClickHouse at its CPU cap and pushed the median
# explorer response from ~20 ms to 4–20 s; the edge's per-second zones never saw
# it, since each second on its own was modest. This zone counts sustained volume:
# a 900-request allowance on top of 30 a minute, so a client is refused only after
# averaging more than one heavy read every two seconds for over half an hour.
# Replayed over 16 days of edge logs (2026-10-29 → 11-13), it would have refused
# four scripts and no browser; 20/min + 600 is where browsers start to appear.
# Polled, micro-cached reads (stats, live, an account's summary, assets) are not
# counted — browsers left open poll those thousands of times an hour, and the
# edge's per-second zones already bound them.
# The client is the LAST X-Forwarded-For entry: the front proxy appends the address
# it accepted the connection from, so earlier entries are the client's own claims.
# A request without the header (internal, on the compose networks) keys by its own
# address. Private addresses and this host's own (its audits and tooling) are
# exempt — an empty key is never limited.
map $http_x_forwarded_for $api_client {
    "~(?<api_client_last>[^,\s]+)\s*$" $api_client_last;
    default $remote_addr;
}
geo $api_client $api_client_exempt {
    default 0;
    127.0.0.0/8 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    # Deployment-specific exempt addresses (e.g. the server's own public address): an
    # empty file in the image, replaced by a local compose override where needed.
    include /etc/nginx/rate-exempt.local.conf;
}
# $uri is matched after the /api/ location's rewrite has stripped its prefix, hence
# the optional `/api`. A list tag's reads (the public `/explorer/list-tag/…` and the
# owner's `/user/list-tag/…`) fold every member's history per request, so all of
# them count.
map "$api_client_exempt:$uri" $explorer_heavy_key {
    "~^1:" "";
    "~^0:(/api)?/explorer/(block/|extrinsic/|extrinsic-at/|activity$|events$|trade/|holders/|list-tag/|contract/[^/]+/events$|address/[^/]+/(activity|extrinsics|events|history|value-events|volume-history|counts)$)" $api_client;
    "~^0:(/api)?/user/list-tag/" $api_client;
    default "";
}
limit_req_zone $explorer_heavy_key zone=explorer_heavy_sustained:20m rate=30r/m;

# Per-client cap on concurrent live streams (/api/explorer/live). A tab holds one,
# so eight covers a reader with several tabs open, while one client cannot pin an
# unbounded number of upstream connections. Keyed like the zone above; an exempt
# client carries an empty key and is never counted.
map $api_client_exempt $api_live_key {
    1 "";
    default $api_client;
}
limit_conn_zone $api_live_key zone=explorer_live_conn:10m;

# Crawlers that fetch what robots.txt disallows. Meta's AI crawler walks the per-row
# history pages (one page per block, extrinsic, event, …) that robots.txt closes to
# every crawler, and runs each page's script, so every page it takes costs its api
# reads too: on 2026-11-18 it made 27% of all requests here (6,808 of them pages
# robots.txt disallows), from addresses that each stay under the sustained brake
# above. Such a crawler is refused exactly the URLs robots.txt disallows (the path
# list below is robots.txt's Disallow list, pinned by tests/crawler-refusal.test.ts);
# every page it may crawl still answers it, and no other client is affected.
map $http_user_agent $robots_ignoring_crawler {
    default 0;
    "~*meta-externalagent" 1;
}
map "$robots_ignoring_crawler:$uri" $refuse_crawler {
    "~^1:/((block|extrinsic|event|dca|intent|swap|transfer|cross-chain|add-liquidity|remove-liquidity|create-pool|destroy-pool|claim-rewards|claim-referral-rewards|collect-fees|rebalance|compound|lend|withdraw|borrow|repay|liquidate|staking|vote|otc-place|otc-pull|otc-fill|bond-issue|bond-redeem|intent-place|intent-fill|intent-cancel|intent-expire|intent-dca-trade|juicer-deposit|juicer-withdraw|juicer-unwind|juicer-settle|juicer-claim|juicer-claim-surplus|juicer-harvest|juicer-rebalance|juicer-delever|juicer-lever|juicer-unlever|bil-deposit|bil-redeem|bil-cancel|bil-settle|bil-claim|bil-reinvest|bil-interest|bil-principal|bil-draw|bil-repay|admin)/|(link-device)$)" 1;
    default 0;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Use the unique container name, NOT the compose service alias `api`: a
    # co-located project on the shared `common` docker network also runs a
    # service named `api`, so `api:3000` round-robins between the two containers
    # (~50% of requests hit the wrong one -> 404). The container_name is unique.
    set $api_upstream hydration-neckwork-api:3000;

    # A robots.txt-ignoring crawler on a disallowed URL (see $refuse_crawler above).
    if ($refuse_crawler) {
        return 403;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. TLS terminates at the front proxy, so this
    # server only ever sees http:// — an absolute redirect it built itself would
    # send a browser from https to http and cost a second hop, and the same
    # rewriting is what used to drop the port from the /assets directory
    # redirect. A relative Location is resolved by the client against the URL it
    # actually requested, which is the right one.
    absolute_redirect off;

    # Baseline browser hardening. Scripts run from this origin only: the one
    # inline script (index.html's theme bootstrap) is allowed by its sha256 hash,
    # which the Dockerfile computes from the built index.html and writes over the
    # placeholder in the policy below — there is no 'unsafe-inline' for scripts, so markup that
    # slips past the forum renderer still cannot run. Inline styles stay allowed
    # (React style props); data fetches remain restricted to this origin.
    # img-src names the only hosts the app loads images from: the asset-metadata
    # CDN and its repository fallback (token and chain icons, src/components/ui.tsx)
    # and Discord's emoji CDN (account icons, api/src/services/omniwatchIdentity.ts).
    # Forum images are same-origin (/ipfs/), profile avatars come from the api, and
    # upload previews and injected wallet icons are data:/blob: URLs. An image from
    # any other host is blocked until its host is listed here.
    # connect-src additionally allows the Hydration RPC on both transports —
    # deliberately never via the API: https for the contract tab's browser-side
    # eth_getCode/eth_call/eth_estimateGas (src/evmRpc.ts), wss for the Write
    # tab's substrate path (src/substrateWrite.ts — dedot submits EVM.call over
    # WebSocket). Anything missing here fails only in production, so keep this
    # list in lockstep with the RPC endpoints the bundle uses.
    # It also allows the MCP host, which the /mcp page reads directly rather
    # than through this origin's API: it probes the endpoint for the live status
    # and renders its tool reference from /tools.json, so the documented tool
    # list is the one the server actually registers. Both are cross-origin by
    # design — the MCP endpoint is deliberately a separate host.
    # worker-src 'self': the push service worker (/sw.js) is a same-origin
    # script, and Chromium checks worker-src (not script-src) when registering
    # it — without this, notifications fail only in production.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' __CSP_SCRIPT_HASH__; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net https://raw.githubusercontent.com https://cdn.discordapp.com; font-src 'self'; connect-src 'self' https://hydration-rpc.neckwork.net wss://hydration-rpc.neckwork.net https://hydration-mcp.neckwork.net; manifest-src 'self'" always;
    # This server is the ONE layer that sets nosniff, X-Frame-Options and
    # Referrer-Policy for the explorer host (the edge proxy in front adds only
    # HSTS and Alt-Svc), so a response never carries two of them. An upstream's
    # own nosniff is hidden for the same reason (proxy_hide_header is inherited
    # by every location that sets none of its own). A location with an add_header
    # of its own inherits none of these, so it restates them (/ipfs/, /api/).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header X-Content-Type-Options;
    # camera=(self): the login dialog's "Scan QR code" stage reads the camera
    # on this origin (device-link handoff); everything else stays denied.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # Compress the SPA bundle and any API JSON the upstream didn't compress.
    # Both `text/javascript` and `application/javascript` are listed because the
    # `.js` mapping in nginx's bundled mime.types changed to `text/javascript`
    # upstream; the base image is unpinned, so a rebuild must not silently drop
    # JavaScript out of gzip_types.
    gzip on;
    gzip_comp_level 6;
    gzip_static on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # nginx compresses only for HTTP/1.1+ clients by default, and nginx's own
    # `proxy_pass` defaults to speaking HTTP/1.0 upstream. A front proxy that
    # does not raise `proxy_http_version` therefore gets every asset and every
    # API payload uncompressed (measured: 258 kB instead of 77 kB for the entry
    # chunk). This container is behind exactly such a hop, so accept 1.0.
    gzip_http_version 1.0;

    # History (clean-path) routing: a hard GET to /activity, /account/x, /asset/43,
    # etc. has no file on disk, so fall back to index.html. The bundled SPA router
    # then reads window.location.pathname and renders the matching page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the SPA shell. It contains the current content-hashed
    # chunk names and must not outlive a container replacement.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # The SPA has an `/assets` page route, but Vite also emits its bundles into a
    # physical `assets/` dir. Without this, a hard GET to `/assets` matches the
    # directory and nginx 301-redirects to `/assets/` — dropping the original port
    # (-> http://localhost/assets/, broken). An exact-match location is evaluated
    # before that directory-redirect logic. It is also the /assets PAGE, and an
    # exact match wins over the page-URL regex below, so it has to take the head
    # renderer itself — whose fallback (@spa) is the same shell this used to serve.
    location = /assets {
        include /etc/nginx/seo_page.conf;
    }

    # Vite emits content-hashed asset filenames, so they're safe to cache forever,
    # and `immutable` spares a reload its revalidation round-trips. The build ships a
    # gzip copy of each text asset beside it (Dockerfile), which gzip_static serves
    # without compressing per request. The add_header here drops the server block's
    # headers, so the three that matter for a script restate them.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fonts keep stable names across a release and are the largest first-load
    # assets after JavaScript. Cache them without letting missing files fall
    # through to the SPA shell as text/html.
    location ^~ /fonts/ {
        try_files $uri =404;
        expires 30d;
    }

    # Icon probes must never fall through to the SPA shell: Safari requests
    # /favicon.ico (and apple-touch-icon variants) directly, and a 200
    # text/html answer gets cached as a permanently broken icon. Missing
    # icon => real 404.
    location ~ ^/(favicon\.ico|apple-touch-icon(-precomposed)?\.png)$ {
        try_files $uri =404;
    }

    # The push service worker. Its filename never changes (a worker is
    # registered by URL), so it must NOT inherit the generic `.js` location's
    # 7-day cache: a stale worker keeps answering pushes with old code long
    # after a deploy, and nothing in the app can replace it. Exact-match beats
    # the regex location below.
    # `expires -1` is what emits `Cache-Control: no-cache` here — the same
    # directive /index.html uses. An `add_header` on this level would silently
    # drop every inherited security header from this one response.
    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    # A typo in a static URL must be a real 404, not the SPA shell with the wrong
    # MIME type. Extensionless paths continue through the history fallback.
    # `txt`/`xml` are deliberately absent: /robots.txt is a real file served by
    # the history-fallback location, and /sitemap*.xml is generated (below).
    location ~* \.(?:css|js|mjs|map|json|webmanifest|woff2?|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    # The consolidated URLs the router redirects client-side. Done here as a real
    # 301 as well: a crawler that follows a link to /tx/<hash> otherwise gets 200
    # and the SPA shell, indexes it, and the canonical URL has to compete with a
    # duplicate of itself. A redirect the server makes is the only one a crawler
    # sees before rendering.
    # The capture goes into the Location header as nginx decoded it, so it takes
    # only an extrinsic id's characters (a hash, or <height>-<index>); any other
    # /tx/ URL falls through to the app, whose router redirects it.
    location ~ ^/tx/([A-Za-z0-9-]+)$ { return 301 /extrinsic/$1; }
    location = /transfers { return 301 /activity?tab=transfer; }
    location = /trades    { return 301 /activity?tab=trade; }
    location = /votes     { return 301 /activity?tab=vote; }
    location = /trade     { return 301 /activity?tab=trade; }
    location ~ ^/trade/([0-9]+-e?[0-9]+)$ { return 301 /swap/$1; }
    # /ice — the solver pallet's name — is an alias of the intents page.
    location = /ice       { return 301 /intents$is_args$args; }
    # Subsquare's paths (hydration.subsquare.io), so a link written for it works
    # with the host swapped: referenda, discussions, the archive bodies
    # addressed by number, tips and externals addressed by `<block>_<hash>` (here
    # `<hash>@<block>`), TC motions and accounts. A TC motion spelled by its hash
    # names no index, so it lands on the committee list. Anything else under these
    # prefixes falls through to the app, whose router maps the same paths.
    location ~ ^/referenda/([0-9]+)$ { return 301 /referendum/opengov/$1; }
    location = /referenda { return 301 /governance?tab=referenda; }
    location ~ ^/posts/([0-9]+)$ { return 301 /discussions/s$1; }
    location ~ ^/democracy/referenda/([0-9]+)$ { return 301 /referendum/democracy/$1; }
    location ~ ^/democracy/proposals/([0-9]+)$ { return 301 /governance/democracy/proposal/$1; }
    location ~ ^/council/motions/([0-9]+)$ { return 301 /governance/motion/council/$1; }
    location ~ ^/treasury/proposals/([0-9]+)$ { return 301 /governance/treasury/proposal/$1; }
    location ~ ^/treasury/spends/([0-9]+)$ { return 301 /governance/treasury/spend/$1; }
    location ~ "^/democracy/externals/([1-9][0-9]{0,9})_(0x[0-9a-f]{64})$" { return 301 /governance/democracy/external/$2@$1; }
    location ~ "^/treasury/tips/([1-9][0-9]{0,9})_(0x[0-9a-f]{64})$" { return 301 /governance/tip/$2@$1; }
    location ~ ^/techcomm/proposals/([0-9]+)$ { return 301 /governance/motion/tc/$1; }
    location ~ "^/techcomm/proposals/([1-9][0-9]{0,9})_(0x[0-9a-f]{64})$" { return 301 /governance?tab=committee; }
    location ~ "^/user/([1-9A-HJ-NP-Za-km-z]{40,50}|0x[0-9a-fA-F]{40}|0x[0-9a-fA-F]{64})(/[A-Za-z0-9_-]*)?$" { return 301 /account/$1; }

    # The sitemaps and robots.txt are built from live chain and list data and
    # from the configured public origin, so they come from the API rather than
    # the image. Without this a sitemap would hit the history fallback and answer
    # 200 text/html — one that fails to parse is worse to submit than none.
    location ~ ^/(sitemap[a-z0-9-]*\.xml)$ {
        proxy_pass http://$api_upstream/$1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    # The referenda Atom feed (referenda by last activity) is built by the API from
    # its referendum directory. Every page names it as an alternate in index.html.
    location = /feeds/referenda.atom {
        proxy_pass http://$api_upstream/feeds/referenda.atom;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    # An unlinked easter egg. Served as RSS rather than the generic text/xml, so a
    # feed reader pointed at it subscribes instead of showing the markup.
    location = /rss.xml {
        types { }
        default_type application/rss+xml;
        try_files $uri =404;
    }

    # robots.txt falls back to the file in the image rather than to an error.
    # A 5xx here is not a neutral failure: a crawler reads it as "stop crawling
    # this host", for 12 hours and degrading for up to 30 days. A slightly stale
    # file is harmless by comparison, so the static copy stays in the image for
    # exactly this case.
    location = /robots.txt {
        proxy_pass http://$api_upstream/robots.txt;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @robots_file;
    }
    location @robots_file {
        try_files /robots.txt =404;
    }

    # Page URLs get a <head> that describes the page. The app is client-rendered,
    # so the file on disk can only carry one generic title and one generic
    # preview card for every URL on the site; this hands the same shell back with
    # that head rewritten from in-memory data (see api/src/routes/seo.ts).
    #
    # Placed AFTER the static-extension regexes above so `/account/x.js` is still
    # a real 404, and matched by path rather than by Accept: crawlers and chat
    # previewers send every Accept value there is, and the answer must not depend
    # on which one.
    #
    # Only the shapes listed here — the hubs, and the detail routes whose id
    # space is bounded enough to be worth describing. Everything else keeps
    # falling through to the static shell, unchanged. An id segment never matches
    # whitespace (`[^/\s]`): $uri is decoded, and a page URL holding a space or
    # CR/LF gets the static shell without a trip to the renderer.
    location ~ ^/(activity|blocks|extrinsics|events|accounts|contracts|assets|governance|discussions|tags|lists|omnipool|liquidity|hdx|hollar|intents|juicer|bil|revenue|volume|oracles|security|mcp|notifications|api-tokens)$ {
        include /etc/nginx/seo_page.conf;
    }
    # A bond family's page (/hollar-bonds, … — one per api bonds.ts BOND_FAMILIES entry).
    location ~ ^/(tags/hydration|security/[a-z-]+|revenue/(users|protocol)|[a-z0-9]+-bonds|governance/(me|propose))$ {
        include /etc/nginx/seo_page.conf;
    }
    location ~ ^/(block|extrinsic|event|account|asset|holders|pool|tag|list|dca|intent|swap|transfer|cross-chain|add-liquidity|remove-liquidity|create-pool|destroy-pool|claim-rewards|claim-referral-rewards|collect-fees|rebalance|compound|lend|withdraw|borrow|repay|liquidate|staking|vote|otc-place|otc-pull|otc-fill|bond-issue|bond-redeem|intent-place|intent-fill|intent-cancel|intent-expire|intent-dca-trade|juicer-deposit|juicer-withdraw|juicer-unwind|juicer-settle|juicer-claim|juicer-claim-surplus|juicer-harvest|juicer-rebalance|juicer-delever|juicer-lever|juicer-unlever|bil-deposit|bil-redeem|bil-cancel|bil-settle|bil-claim|bil-reinvest|bil-interest|bil-principal|bil-draw|bil-repay)/[^/\s]+$ {
        include /etc/nginx/seo_page.conf;
    }
    location ~ ^/(asset/xc/[^/\s]+|referendum/(opengov|democracy)/[0-9]+|discussions/[A-Za-z0-9]+|governance/(motion/(council|tc)|tip|treasury/(proposal|spend)|democracy/(proposal|external))/[^/\s]+)$ {
        include /etc/nginx/seo_page.conf;
    }
    # An oracle feed id can hold a DIA key's slash (dia:<contract>:DOT/USD), which
    # $uri carries decoded, so the id is the whole rest of the path.
    location ~ ^/oracle/[^/\s]+(/[^/\s]+)?$ {
        include /etc/nginx/seo_page.conf;
    }
    location = / {
        include /etc/nginx/seo_page.conf;
    }

    # Where every seo_page.conf failure lands: the exact file the history
    # fallback serves, with the same revalidate-always semantics. A renderer that
    # is down, slow or newly deployed therefore costs the metadata and nothing
    # else — the reader still gets the app.
    location @spa {
        try_files /index.html =404;
        expires -1;
    }

    # Forum images, same-origin: /ipfs/<cid> → the api's /forum/media/<cid>, which
    # serves only CIDs the forum pinned (an unknown CID is a 404 — this is not an open
    # gateway) with the validated Content-Type and a sandboxing CSP of its own, which
    # passes through untouched (the add_header below means the server-level headers
    # are not inherited here: the CSP that counts is the api's, and nosniff and the
    # other two are restated).
    # Anything that is not a plain CID is a 404 here.
    location ^~ /ipfs/ {
        location ~ "^/ipfs/[A-Za-z0-9]{46,121}$" {
            rewrite ^/ipfs/(.*)$ /forum/media/$1 break;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_cache ipfs_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "ipfs:$uri";
            # The api tells browsers a CID's bytes are immutable for a year; this
            # cache keeps its own copy a day regardless, so an image moderators
            # stop serving leaves it within that.
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_valid 200 1d;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout;
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_read_timeout 30s;
        }
        return 404;
    }

    # Server-sent head events: one long-lived stream per tab. Never cached,
    # never buffered — frames must reach the browser the instant the API
    # writes them. X-Accel-Buffering is an nginx-internal control header that
    # each hop consumes WITHOUT forwarding, so the front proxy would silently
    # buffer the stream to death (measured: zero bytes for 15s through two
    # hops); pass it through explicitly so every hop in front of us disables
    # buffering too.
    location = /api/explorer/live {
        # See explorer_live_conn at the top.
        limit_conn explorer_live_conn 8;
        limit_conn_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass_header X-Accel-Buffering;
    }

    # Forum image uploads: raw image bytes (≤ 5 MiB, validated and stripped by the api)
    # on this one route; every other /api/user/ body keeps nginx's 1 MiB default.
    location = /api/user/forum/media {
        client_max_body_size 6m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 90s;
    }

    # Authenticated, per-user API surface. Responses vary by Authorization
    # header, so they must NEVER enter the shared micro-cache (its key is the
    # URI alone). No proxy_cache here — every request goes upstream.
    location ^~ /api/user/ {
        # An encoded slash or backslash in the path is refused. nginx decodes and
        # resolves it before choosing a location, so `<id>%2F..%2F..` in one id
        # segment would address a different endpoint with the caller's session; no
        # id on this surface ever holds either character. The query string may.
        if ($request_uri ~* "^[^?]*%(2f|5c)") {
            return 400;
        }
        # A list tag's reads count toward explorer_heavy_sustained (see the top);
        # nothing else here carries a key.
        limit_req zone=explorer_heavy_sustained burst=900 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The page-head renderer is called by the page locations themselves
    # (seo_page.conf → $api_upstream/seo/page…), never through /api/. Reached that
    # way it would answer the full app shell from a location whose add_headers drop
    # the server block's CSP, so it does not exist here.
    location ^~ /api/seo/ { return 404; }

    location ^~ /api/ {
        # See explorer_heavy_sustained at the top; only the heavy reads carry a key.
        limit_req zone=explorer_heavy_sustained burst=900 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Buffering is required for the cache. (If SSE is ever added, give it its
        # own location with `proxy_buffering off` and no cache.)
        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        # The read-only API emits Access-Control-Allow-Origin: *, so every
        # origin can safely share the same cached representation.
        proxy_cache_key "$request_uri";
        # A request carrying credentials is answered for that caller alone: it is
        # never served from the shared cache nor stored in it, whatever path it
        # names (the per-user surface has its own uncached location above).
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;
        # Collapse concurrent misses into ONE upstream fetch (the lock alone
        # prevents stampedes). Stale entries are served only when the upstream
        # is actually failing — NOT while updating: `use_stale updating` put an
        # unbounded-age response in front of every first poll after an idle
        # gap, which dominated block-to-screen latency now that the API itself
        # answers from a head-keyed memory cache in milliseconds. A synchronous
        # revalidation is cheaper than showing minutes-old data.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 65s;
        proxy_cache_use_stale error timeout;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_read_timeout 3600s;
    }

    # A refused /api/ request: the API's own JSON error shape, and when to retry
    # (a minute rebuilds part of the allowance for a client that backs off).
    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 429 '{"error":"Too many requests; slow down and retry later"}';
    }
}

# Shared micro-cache for API GETs. All /explorer responses are anonymous and the
# API stamps them with `public, max-age=…` (which nginx honors for entry
# lifetime), so N concurrent clients polling the same endpoint collapse to at
# most one upstream request per TTL — the API/ClickHouse load stays O(1) in the
# number of viewers even before the API's own in-process cache kicks in.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=200m inactive=15m use_temp_path=off;

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Use the unique container name, NOT the compose service alias `api`: a
    # co-located project on the shared `common` docker network also runs a
    # service named `api`, so `api:3000` round-robins between the two containers
    # (~50% of requests hit the wrong one -> 404). The container_name is unique.
    set $api_upstream hydration-neckwork-api:3000;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. TLS terminates at the front proxy, so this
    # server only ever sees http:// — an absolute redirect it built itself would
    # send a browser from https to http and cost a second hop, and the same
    # rewriting is what used to drop the port from the /assets directory
    # redirect. A relative Location is resolved by the client against the URL it
    # actually requested, which is the right one.
    absolute_redirect off;

    # Baseline browser hardening. The app intentionally permits inline styles
    # and its tiny inline theme/bootstrap scripts; all executable/data fetches
    # remain restricted to this origin, while account/token images may use HTTPS.
    # connect-src additionally allows the Hydration RPC on both transports —
    # deliberately never via the API: https for the contract tab's browser-side
    # eth_getCode/eth_call/eth_estimateGas (src/evmRpc.ts), wss for the Write
    # tab's substrate path (src/substrateWrite.ts — dedot submits EVM.call over
    # WebSocket). Anything missing here fails only in production, so keep this
    # list in lockstep with the RPC endpoints the bundle uses.
    # It also allows the MCP host, which the /mcp page reads directly rather
    # than through this origin's API: it probes the endpoint for the live status
    # and renders its tool reference from /tools.json, so the documented tool
    # list is the one the server actually registers. Both are cross-origin by
    # design — the MCP endpoint is deliberately a separate host.
    # worker-src 'self': the push service worker (/sw.js) is a same-origin
    # script, and Chromium checks worker-src (not script-src) when registering
    # it — without this, notifications fail only in production.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://hydration-rpc.neckwork.net wss://hydration-rpc.neckwork.net https://hydration-mcp.neckwork.net; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=(self): the login dialog's "Scan QR code" stage reads the camera
    # on this origin (device-link handoff); everything else stays denied.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # Compress the SPA bundle and any API JSON the upstream didn't compress.
    # Both `text/javascript` and `application/javascript` are listed because the
    # `.js` mapping in nginx's bundled mime.types changed to `text/javascript`
    # upstream; the base image is unpinned, so a rebuild must not silently drop
    # JavaScript out of gzip_types.
    gzip on;
    gzip_comp_level 6;
    gzip_static on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # nginx compresses only for HTTP/1.1+ clients by default, and nginx's own
    # `proxy_pass` defaults to speaking HTTP/1.0 upstream. A front proxy that
    # does not raise `proxy_http_version` therefore gets every asset and every
    # API payload uncompressed (measured: 258 kB instead of 77 kB for the entry
    # chunk). This container is behind exactly such a hop, so accept 1.0.
    gzip_http_version 1.0;

    # History (clean-path) routing: a hard GET to /activity, /account/x, /asset/43,
    # etc. has no file on disk, so fall back to index.html. The bundled SPA router
    # then reads window.location.pathname and renders the matching page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the SPA shell. It contains the current content-hashed
    # chunk names and must not outlive a container replacement.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # The SPA has an `/assets` page route, but Vite also emits its bundles into a
    # physical `assets/` dir. Without this, a hard GET to `/assets` matches the
    # directory and nginx 301-redirects to `/assets/` — dropping the original port
    # (-> http://localhost/assets/, broken). An exact-match location is evaluated
    # before that directory-redirect logic, so serve the SPA shell directly.
    location = /assets {
        try_files /index.html =404;
    }

    # Vite emits content-hashed asset filenames, so they're safe to cache forever.
    location ^~ /assets/ {
        try_files $uri =404;
        expires max;
    }

    # Fonts keep stable names across a release and are the largest first-load
    # assets after JavaScript. Cache them without letting missing files fall
    # through to the SPA shell as text/html.
    location ^~ /fonts/ {
        try_files $uri =404;
        expires 30d;
    }

    # Icon probes must never fall through to the SPA shell: Safari requests
    # /favicon.ico (and apple-touch-icon variants) directly, and a 200
    # text/html answer gets cached as a permanently broken icon. Missing
    # icon => real 404.
    location ~ ^/(favicon\.ico|apple-touch-icon(-precomposed)?\.png)$ {
        try_files $uri =404;
    }

    # The push service worker. Its filename never changes (a worker is
    # registered by URL), so it must NOT inherit the generic `.js` location's
    # 7-day cache: a stale worker keeps answering pushes with old code long
    # after a deploy, and nothing in the app can replace it. Exact-match beats
    # the regex location below.
    # `expires -1` is what emits `Cache-Control: no-cache` here — the same
    # directive /index.html uses. An `add_header` on this level would silently
    # drop every inherited security header from this one response.
    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    # A typo in a static URL must be a real 404, not the SPA shell with the wrong
    # MIME type. Extensionless paths continue through the history fallback.
    # `txt`/`xml` are deliberately absent: /robots.txt is a real file served by
    # the history-fallback location, and /sitemap*.xml is generated (below).
    location ~* \.(?:css|js|mjs|map|json|webmanifest|woff2?|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    # The consolidated URLs the router redirects client-side. Done here as a real
    # 301 as well: a crawler that follows a link to /tx/<hash> otherwise gets 200
    # and the SPA shell, indexes it, and the canonical URL has to compete with a
    # duplicate of itself. A redirect the server makes is the only one a crawler
    # sees before rendering.
    location ~ ^/tx/(.+)$ { return 301 /extrinsic/$1; }
    location = /transfers { return 301 /activity?tab=transfer; }
    location = /trades    { return 301 /activity?tab=trade; }
    location = /votes     { return 301 /activity?tab=vote; }

    # The sitemaps and robots.txt are built from live chain and list data and
    # from the configured public origin, so they come from the API rather than
    # the image. Without this a sitemap would hit the history fallback and answer
    # 200 text/html — one that fails to parse is worse to submit than none.
    location ~ ^/(sitemap[a-z0-9-]*\.xml)$ {
        proxy_pass http://$api_upstream/$1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    # robots.txt falls back to the file in the image rather than to an error.
    # A 5xx here is not a neutral failure: a crawler reads it as "stop crawling
    # this host", for 12 hours and degrading for up to 30 days. A slightly stale
    # file is harmless by comparison, so the static copy stays in the image for
    # exactly this case.
    location = /robots.txt {
        proxy_pass http://$api_upstream/robots.txt;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @robots_file;
    }
    location @robots_file {
        try_files /robots.txt =404;
    }

    # Page URLs get a <head> that describes the page. The app is client-rendered,
    # so the file on disk can only carry one generic title and one generic
    # preview card for every URL on the site; this hands the same shell back with
    # that head rewritten from in-memory data (see api/src/routes/seo.ts).
    #
    # Placed AFTER the static-extension regexes above so `/account/x.js` is still
    # a real 404, and matched by path rather than by Accept: crawlers and chat
    # previewers send every Accept value there is, and the answer must not depend
    # on which one.
    #
    # Only the shapes listed here — the hubs, and the detail routes whose id
    # space is bounded enough to be worth describing. Everything else keeps
    # falling through to the static shell, unchanged.
    location ~ ^/(activity|blocks|extrinsics|events|accounts|contracts|assets|governance|tags|lists|omnipool|liquidity|hdx|hollar|ice|revenue|security|mcp)$ {
        include /etc/nginx/seo_page.conf;
    }
    location ~ ^/(tags/hydration|security/[a-z-]+)$ {
        include /etc/nginx/seo_page.conf;
    }
    location ~ ^/(block|extrinsic|event|account|asset|holders|pool|tag|list|dca|intent|swap|transfer|cross-chain|add-liquidity|remove-liquidity|create-pool|destroy-pool|claim-rewards|claim-referral-rewards|collect-fees|rebalance|lend|withdraw|borrow|repay|liquidate|staking|vote|otc-place|otc-pull|otc-fill|bond-issue|bond-redeem|intent-place|intent-fill|intent-cancel|intent-expire|intent-dca-trade)/[^/]+$ {
        include /etc/nginx/seo_page.conf;
    }
    location ~ ^/(asset/xc/[^/]+|referendum/(opengov|democracy)/[0-9]+)$ {
        include /etc/nginx/seo_page.conf;
    }
    location = / {
        include /etc/nginx/seo_page.conf;
    }

    # Where every seo_page.conf failure lands: the exact file the history
    # fallback serves, with the same revalidate-always semantics. A renderer that
    # is down, slow or newly deployed therefore costs the metadata and nothing
    # else — the reader still gets the app.
    location @spa {
        try_files /index.html =404;
        expires -1;
    }

    # Server-sent head events: one long-lived stream per tab. Never cached,
    # never buffered — frames must reach the browser the instant the API
    # writes them. X-Accel-Buffering is an nginx-internal control header that
    # each hop consumes WITHOUT forwarding, so the front proxy would silently
    # buffer the stream to death (measured: zero bytes for 15s through two
    # hops); pass it through explicitly so every hop in front of us disables
    # buffering too.
    location = /api/explorer/live {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass_header X-Accel-Buffering;
    }

    # Authenticated, per-user API surface. Responses vary by Authorization
    # header, so they must NEVER enter the shared micro-cache (its key is the
    # URI alone). No proxy_cache here — every request goes upstream.
    location ^~ /api/user/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Buffering is required for the cache. (If SSE is ever added, give it its
        # own location with `proxy_buffering off` and no cache.)
        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        # The read-only API emits Access-Control-Allow-Origin: *, so every
        # origin can safely share the same cached representation.
        proxy_cache_key "$request_uri";
        # Collapse concurrent misses into ONE upstream fetch (the lock alone
        # prevents stampedes). Stale entries are served only when the upstream
        # is actually failing — NOT while updating: `use_stale updating` put an
        # unbounded-age response in front of every first poll after an idle
        # gap, which dominated block-to-screen latency now that the API itself
        # answers from a head-keyed memory cache in milliseconds. A synchronous
        # revalidation is cheaper than showing minutes-old data.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 65s;
        proxy_cache_use_stale error timeout;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_read_timeout 3600s;
    }
}

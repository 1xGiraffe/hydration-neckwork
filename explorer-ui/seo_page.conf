# Shared body of every page-URL location in nginx.conf: proxy the request to the
# API's head renderer, and fall back to the static shell on any failure.
#
# Included rather than repeated because the failure behaviour is the whole point
# — a copy that forgot `proxy_intercept_errors` would turn a restarting API into
# a 502 on a page that has always been served from disk.
#
# `$uri` and not `$request_uri`: the query string is view state (?tab=, ?page=,
# ?sort=), every value of it is the same page, and the canonical the renderer
# emits points at the bare path. Passing it would only fragment the cache.
#
# No `add_header` here, deliberately: one in this context would drop every
# security header inherited from the server block (CSP, nosniff, X-Frame-Options,
# Referrer-Policy, Permissions-Policy) from these responses alone.
proxy_pass http://$api_upstream/seo/page$uri;
proxy_set_header Host $host;

# Degrade fast. A page load must not wait on an unhealthy renderer: at worst this
# costs ~3s before the static shell is served, and normally it answers in
# single-digit milliseconds because every lookup behind it is an in-memory map.
proxy_connect_timeout 1s;
proxy_send_timeout 2s;
proxy_read_timeout 2s;
proxy_next_upstream off;

# Anything that is not a rendered page — a 502 from a cold renderer, a gateway
# timeout, a 404 from a path the API does not recognise — becomes the shell.
proxy_intercept_errors on;
error_page 404 500 502 503 504 = @spa;

# Shared, since the answer depends only on the path. Keyed on $uri for the same
# reason the query string is dropped above. Deliberately WITHOUT the
# X-Cache-Status header the /api/ location sets: an add_header in this context
# would drop the server block's security headers from the page responses, which
# is a steeper price than losing a debugging header.
proxy_cache api_cache;
proxy_cache_key "seo:$uri";
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_use_stale error timeout updating;
proxy_cache_valid 200 60s;

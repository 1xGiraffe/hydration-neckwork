name: hydration-neckwork

# Applied to every service. Container logs are bounded: the daemon's json-file
# default is unlimited and shares a disk with clickhouse_data, so an unattended
# stack fills it. The restart policy brings the stack back after a host reboot;
# a service that must run once and exit states its own.
x-service: &service
  restart: unless-stopped
  networks:
    - neckwork
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

# Raw ingestion tuning shared by the two raw pipelines. They differ only in
# their pipeline id, batch size and RPC budget, which each states for itself.
x-raw-env: &raw-env
  RPC_URL: "${RPC_URL:-https://hydration-rpc.neckwork.net}"
  SQD_GATEWAY: "${SQD_GATEWAY:-https://v2.archive.subsquid.io/network/hydradx}"
  SQD_GATEWAY_API_KEY: "${SQD_GATEWAY_API_KEY:-}"
  CLICKHOUSE_HOST: "http://clickhouse:8123"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-dev}"
  RPC_HEAD_POLL_MS: "${RPC_HEAD_POLL_MS:-}"
  RAW_LIVE_FINALITY_POLL_MS: "${RAW_LIVE_FINALITY_POLL_MS:-}"
  RAW_BALANCE_READ_CONCURRENCY: "${RAW_BALANCE_READ_CONCURRENCY:-20}"
  RAW_BALANCE_READ_BATCH_ENABLED: "${RAW_BALANCE_READ_BATCH_ENABLED:-true}"
  RAW_BALANCE_READ_BATCH_SIZE: "${RAW_BALANCE_READ_BATCH_SIZE:-250}"
  RAW_BALANCE_READ_BATCH_CONCURRENCY: "${RAW_BALANCE_READ_BATCH_CONCURRENCY:-4}"
  RAW_SNAPSHOT_READ_BATCH_SIZE: "${RAW_SNAPSHOT_READ_BATCH_SIZE:-100}"
  RAW_SNAPSHOT_READ_BATCH_CONCURRENCY: "${RAW_SNAPSHOT_READ_BATCH_CONCURRENCY:-2}"
  RAW_MONEY_MARKET_ETH_CALL_TIMEOUT_MS: "${RAW_MONEY_MARKET_ETH_CALL_TIMEOUT_MS:-20000}"
  RAW_MONEY_MARKET_POSITION_CONCURRENCY: "${RAW_MONEY_MARKET_POSITION_CONCURRENCY:-8}"
  RAW_MONEY_MARKET_BATCH_SIZE: "${RAW_MONEY_MARKET_BATCH_SIZE:-50}"
  RAW_MM_PERIODIC_SNAPSHOT_ENABLED: "${RAW_MM_PERIODIC_SNAPSHOT_ENABLED:-true}"
  # Chain time, not a block count: the money-market re-snapshot costs an
  # eth_call per known borrower, so a block-count interval would have
  # tripled its RPC fan-out at a 2s block time. 720 = 12h.
  RAW_MM_SNAPSHOT_INTERVAL_MINUTES: "${RAW_MM_SNAPSHOT_INTERVAL_MINUTES:-}"
  # Deprecated block-count form, passed through empty so a deployment that still
  # sets it gets the startup warning naming the replacement instead of silence.
  RAW_MM_SNAPSHOT_INTERVAL_BLOCKS: "${RAW_MM_SNAPSHOT_INTERVAL_BLOCKS:-}"
  # Chain time between asset-registry scans. 100 = what the old
  # RAW_ASSET_SNAPSHOT_INTERVAL of 1000 blocks meant at 6s.
  RAW_ASSET_SNAPSHOT_INTERVAL_MINUTES: "${RAW_ASSET_SNAPSHOT_INTERVAL_MINUTES:-}"
  RAW_ASSET_SNAPSHOT_INTERVAL: "${RAW_ASSET_SNAPSHOT_INTERVAL:-}"
  # One raw_block_snapshots row per N blocks. 1 = today's per-block behaviour.
  # The table is the largest in the database and 36% of all growth, so N is the
  # one pure-config disk lever; N must divide the 600-block pool-history MV grid
  # (checked at startup). Do NOT raise it before the main/price pipeline stops
  # requiring a snapshot row for every block it replays — see the migration runbook.
  RAW_SNAPSHOT_EVERY_N_BLOCKS: "${RAW_SNAPSHOT_EVERY_N_BLOCKS:-1}"

services:
  clickhouse:
    <<: *service
    build:
      context: ./clickhouse
      dockerfile: Dockerfile
    container_name: hydration-neckwork-clickhouse
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=price_data
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      # A cold start over the full part set takes minutes; without this the
      # server is declared unhealthy after 50s and every `service_healthy` gate
      # downstream fails on a restart that would have succeeded.
      start_period: 180s

  # Applies clickhouse/schema/*.sql to a fresh server before any ingestion or
  # API service starts. Runs once and exits 0 (nonzero on failure); everything
  # downstream gates on `service_completed_successfully` so nothing races an
  # empty/partial schema.
  schema-bootstrap:
    <<: *service
    build:
      context: ./api
      dockerfile: Dockerfile
    image: hydration-neckwork-api
    container_name: hydration-neckwork-schema-bootstrap
    restart: "no"
    command: ["./node_modules/.bin/tsx", "src/db/schemaBootstrap.ts", "--apply"]
    volumes:
      - ./clickhouse/schema:/schema:ro
    environment:
      - SCHEMA_DIR=/schema
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    depends_on:
      clickhouse:
        condition: service_healthy

  indexer:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-indexer
    profiles:
      - worker
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - SQD_GATEWAY=${SQD_GATEWAY:-https://v2.archive.subsquid.io/network/hydradx}
      - SQD_GATEWAY_API_KEY=${SQD_GATEWAY_API_KEY:-}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${INDEXER_RPC_RATE_LIMIT:-100}
      - RPC_CAPACITY=${INDEXER_RPC_CAPACITY:-20}
      # Empty means "use the code default". Passing the knobs through is what
      # makes the 2s migration values and the deprecated-name warnings usable by
      # supervisor-created main-live workers.
      - RPC_HEAD_POLL_MS=${RPC_HEAD_POLL_MS:-}
      - SNAPSHOT_INTERVAL_MINUTES=${SNAPSHOT_INTERVAL_MINUTES:-}
      - SNAPSHOT_INTERVAL=${SNAPSHOT_INTERVAL:-}
      - BATCH_SIZE=${INDEXER_BATCH_SIZE:-10000}
      - GRAPH_MIN_PATH_LIQUIDITY_USD=${GRAPH_MIN_PATH_LIQUIDITY_USD:-}

  raw-indexer:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-raw-indexer
    profiles:
      - worker
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *raw-env
      RPC_RATE_LIMIT: "${RAW_RPC_RATE_LIMIT:-50}"
      RPC_CAPACITY: "${RAW_RPC_CAPACITY:-10}"
      BATCH_SIZE: "${RAW_BATCH_SIZE:-50000}"
      RAW_PIPELINE_ID: "${RAW_PIPELINE_ID:-raw-main}"
    command: ["src/raw/cli.ts"]

  raw-live:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-raw-live
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *raw-env
      RPC_RATE_LIMIT: "${RAW_LIVE_RPC_RATE_LIMIT:-50}"
      RPC_CAPACITY: "${RAW_LIVE_RPC_CAPACITY:-10}"
      BATCH_SIZE: "${RAW_LIVE_BATCH_SIZE:-50000}"
      RAW_PIPELINE_ID: "raw-live"
    command: ["src/raw/cli.ts", "--pipeline-id=raw-live"]

  # Populates price_data.account_identities from the Identity pallet of Hydration and
  # of every chain in IDENTITY_CHAINS (the Polkadot/Kusama People chains and their
  # testnets by default), on startup and then hourly. Self-seeding so a fresh
  # `docker compose up` gets identities with no manual step. IDENTITY_CHAINS is
  # forwarded only when set, so the code default in src/config.ts stays canonical.
  identity-snapshot:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-identity-snapshot
    depends_on:
      clickhouse:
        condition: service_healthy
      # The first pass writes immediately, so the table has to exist by then.
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - IDENTITY_CHAINS
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${IDENTITY_RPC_RATE_LIMIT:-20}
      - RPC_CAPACITY=${IDENTITY_RPC_CAPACITY:-5}
    command: ["src/scripts/snapshot-identities.ts", "--loop", "--refresh-hours=${IDENTITY_REFRESH_HOURS:-1}"]

  # Nightly export of the user_* tables (see clickhouse/schema/004_user.sql) —
  # the only ClickHouse state not reproducible from raw chain data. Reuses the
  # clickhouse service's own image so the client version always matches the
  # server. See ops/backup-user-tables.sh for the export/retention/restore
  # procedure.
  user-backup:
    <<: *service
    build: ./clickhouse
    container_name: hydration-neckwork-user-backup
    entrypoint: ["/bin/sh", "/backup-user-tables.sh"]
    volumes:
      - ./ops/backup-user-tables.sh:/backup-user-tables.sh:ro
      - user_backups:/backups
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully

  # Referendum proposal calls. A referendum names its proposal by hash and the call
  # itself lives in a preimage as SCALE bytes, which only runtime metadata can read —
  # hence an indexer-side decoder rather than API-side. A hash IS its content, so a
  # decoded proposal is never revisited and this goes quiet once caught up.
  referendum-proposals:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-referendum-proposals
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      # Metadata fetches are heavy and the public endpoints throttle hard when the other
      # snapshot services are busy; this one is not rate limited.
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${REFERENDUM_PROPOSAL_RPC_RATE_LIMIT:-20}
      - RPC_CAPACITY=${REFERENDUM_PROPOSAL_RPC_CAPACITY:-4}
    command: ["src/scripts/decode-referendum-proposals.ts", "--loop",
      "--cycle-minutes=${REFERENDUM_PROPOSAL_CYCLE_MINUTES:-30}",
      "--max=${REFERENDUM_PROPOSAL_MAX:-200}"]

  # Referendum titles from SubSquare. The chain has no human title for a
  # referendum, so "#369" is all the explorer could show without this. Live
  # referenda are re-read every LIVE_REFRESH_MINUTES (Hydration usually has 0-2
  # open); concluded ones are fetched once and then never requested again, which is
  # what keeps the 576 settled referenda from being re-crawled every cycle.
  referendum-titles:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-referendum-titles
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - SUBSQUARE_BASE_URL=${SUBSQUARE_BASE_URL:-https://hydration.subsquare.io}
    command: ["src/scripts/snapshot-referendum-titles.ts", "--loop",
      "--cycle-minutes=${REFERENDUM_TITLE_CYCLE_MINUTES:-15}",
      "--live-refresh-minutes=${REFERENDUM_TITLE_LIVE_REFRESH_MINUTES:-30}",
      "--max-fetches=${REFERENDUM_TITLE_MAX_FETCHES:-40}",
      "--delay-ms=${REFERENDUM_TITLE_DELAY_MS:-1500}"]

  # Seed current balances for every account, including dormant accounts with no
  # events in the indexed range, and refresh them on an interval.
  balance-snapshot:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-balance-snapshot
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${BALANCES_SNAPSHOT_RPC_RATE_LIMIT:-20}
      - RPC_CAPACITY=${BALANCES_SNAPSHOT_RPC_CAPACITY:-5}
    command: ["src/scripts/snapshot-balances.ts", "--loop", "--refresh-hours=${BALANCES_REFRESH_HOURS:-24}"]

  # Money-market sweep: after the balance snapshot has seeded all accounts, calls
  # getUserAccountData for every account in the primary pool and for the bounded
  # observed participant set in supplemental pools. This keeps core coverage
  # exhaustive without multiplying the RPC workload for sparse isolated markets.
  mm-snapshot:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-mm-snapshot
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${MM_SNAPSHOT_RPC_RATE_LIMIT:-20}
      - RPC_CAPACITY=${MM_SNAPSHOT_RPC_CAPACITY:-5}
      - RAW_MONEY_MARKET_POSITION_CONCURRENCY=${RAW_MONEY_MARKET_POSITION_CONCURRENCY:-8}
      - RAW_MONEY_MARKET_BATCH_SIZE=${RAW_MONEY_MARKET_BATCH_SIZE:-50}
      - RAW_MONEY_MARKET_ETH_CALL_TIMEOUT_MS=${RAW_MONEY_MARKET_ETH_CALL_TIMEOUT_MS:-20000}
    command: ["src/scripts/snapshot-money-market.ts", "--market=core", "--loop", "--refresh-hours=${MM_SNAPSHOT_REFRESH_HOURS:-6}"]

  # Refresh sparse supplemental-market (GIGAHDX, BIL) positions more often than
  # the exhaustive primary sweep.
  mm-supplemental-snapshot:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-mm-supplemental-snapshot
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RAW_MONEY_MARKET_POSITION_CONCURRENCY=${RAW_MONEY_MARKET_POSITION_CONCURRENCY:-8}
      - RAW_MONEY_MARKET_BATCH_SIZE=${RAW_MONEY_MARKET_BATCH_SIZE:-50}
      - RAW_MONEY_MARKET_ETH_CALL_TIMEOUT_MS=${RAW_MONEY_MARKET_ETH_CALL_TIMEOUT_MS:-20000}
    command:
      - src/scripts/snapshot-money-market.ts
      - --market=gigahdx,bil
      - --loop
      - --refresh-minutes=${MM_SUPPLEMENTAL_SNAPSHOT_MINUTES:-15}

  # The B0 anchors loop (see src/scripts/anchorLoop.ts). aToken / variable-debt
  # scaled-balance anchor (clickhouse/schema/007_money_market_history.sql): refreshes
  # the reserve map each cycle and self-re-establishes the scaledBalanceOf@B0 anchor
  # whenever its table is empty (e.g. after a wipe & reindex). Money-market incentive
  # anchor (price_data.mm_incentive_anchor; src/scripts/mmIncentiveAnchor.ts): the
  # RewardsController's own per-user accrual and indexes at B0, captured once its
  # table is empty and the controller's logs are indexed back to its first
  # configuration. One-time bounded RPC each. Every cycle it also repairs the
  # liquidity-mining entry capture (price_data.raw_lm_farm_entries, captured in-block
  # by the raw indexer): each block with an open raw_parser_warnings row is re-read
  # against this service's archive RPC_URL (src/scripts/lmEntryCapture.ts).
  atoken-anchor:
    <<: *service
    image: hydration-neckwork-indexer:latest
    build: .
    container_name: hydration-neckwork-atoken-anchor
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    command: ["src/scripts/snapshot-atoken-anchors.ts", "--loop", "--refresh-hours=${ATOKEN_ANCHOR_REFRESH_HOURS:-6}"]

  ingestion-supervisor:
    <<: *service
    build:
      context: .
      dockerfile: ops/supervisor.Dockerfile
    container_name: hydration-neckwork-ingestion-supervisor
    depends_on:
      clickhouse:
        condition: service_healthy
      raw-live:
        condition: service_started
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-hydration-neckwork}
      - ROOT_DIR=/etc/hydration-neckwork
      - CLICKHOUSE_DATABASE=price_data
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - SQD_GATEWAY=${SQD_GATEWAY:-https://v2.archive.subsquid.io/network/hydradx}
      - SQD_GATEWAY_API_KEY=${SQD_GATEWAY_API_KEY:-}
      # Handed to every worker the supervisor spawns — backfill, raw-live and the
      # price pipelines alike.
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - RAW_WORKERS=${RAW_WORKERS:-6}
      - RAW_FAILED_RETRY_LIMIT=${RAW_FAILED_RETRY_LIMIT:-3}
      - RAW_BLOCKED_RETRY_AFTER_SECONDS=${RAW_BLOCKED_RETRY_AFTER_SECONDS:-21600}
      # Blocks per backfill range. Block-denominated by design (a range is a unit of
      # indexing work); a faster chain means more ranges per day, not bigger ones.
      # No change needed at a block-time cutover — see scripts/ingestion-supervisor.sh.
      - RANGE_SIZE=${RANGE_SIZE:-1000}
      - MAIN_MAX_RANGES=${MAIN_MAX_RANGES:-3}
      - MAIN_WORKERS=${MAIN_WORKERS:-3}
      - POLL_SECONDS=${POLL_SECONDS:-60}
      - RAW_RATE_LIMIT=${RAW_RATE_LIMIT:-50}
      - RAW_CAPACITY=${RAW_CAPACITY:-10}
      - RAW_BALANCE_READ_CONCURRENCY=${RAW_BALANCE_READ_CONCURRENCY:-20}
      - RAW_BALANCE_READ_BATCH_SIZE=${RAW_BALANCE_READ_BATCH_SIZE:-250}
      - RAW_BALANCE_READ_BATCH_CONCURRENCY=${RAW_BALANCE_READ_BATCH_CONCURRENCY:-4}
      - RAW_SNAPSHOT_READ_BATCH_SIZE=${RAW_SNAPSHOT_READ_BATCH_SIZE:-100}
      - RAW_SNAPSHOT_READ_BATCH_CONCURRENCY=${RAW_SNAPSHOT_READ_BATCH_CONCURRENCY:-2}
      - RAW_MONEY_MARKET_POSITION_CONCURRENCY=${RAW_MONEY_MARKET_POSITION_CONCURRENCY:-8}
      - RAW_MONEY_MARKET_BATCH_SIZE=${RAW_MONEY_MARKET_BATCH_SIZE:-50}
      - MAIN_RATE_LIMIT=${MAIN_RATE_LIMIT:-40}
      - MAIN_CAPACITY=${MAIN_CAPACITY:-8}
      - LIVE_MAIN_ENABLED=${LIVE_MAIN_ENABLED:-true}
      - LIVE_MAIN_NAME=${LIVE_MAIN_NAME:-hydration-neckwork-main-live}
      - LIVE_MAIN_PIPELINE_ID=${LIVE_MAIN_PIPELINE_ID:-main-live}
      - LIVE_MAIN_RATE_LIMIT=${LIVE_MAIN_RATE_LIMIT:-100}
      - LIVE_MAIN_CAPACITY=${LIVE_MAIN_CAPACITY:-20}
      - LIVE_MAIN_BATCH_SIZE=${LIVE_MAIN_BATCH_SIZE:-50000}
      # The per-worker tuning knobs the spawned services interpolate. A worker is
      # created by `docker compose run` from INSIDE this container, so every
      # `${VAR}` in the indexer/raw service definitions resolves against the
      # environment here, not the host's .env — a name missing from this list is
      # permanently empty for every worker however the host is configured. Empty
      # means "use the code default" (src/util/env.ts), so a pass-through entry
      # costs nothing when unset. A knob the spawn passes with its own `-e`
      # (RPC_URL, the two rate-limit knobs, the pipeline id) does not belong
      # here: the explicit flag wins and the entry would never be read.
      - INDEXER_BATCH_SIZE=${INDEXER_BATCH_SIZE:-}
      - RPC_HEAD_POLL_MS=${RPC_HEAD_POLL_MS:-}
      - SNAPSHOT_INTERVAL_MINUTES=${SNAPSHOT_INTERVAL_MINUTES:-}
      - SNAPSHOT_INTERVAL=${SNAPSHOT_INTERVAL:-}
      - GRAPH_MIN_PATH_LIQUIDITY_USD=${GRAPH_MIN_PATH_LIQUIDITY_USD:-}
      - RAW_BATCH_SIZE=${RAW_BATCH_SIZE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The supervisor spawns its workers from this compose file and this script.
      # Both are also baked into its image, which is the trap: without these mounts
      # a deployment that edits either one keeps spawning workers from the copy
      # frozen at image-build time, silently and with no version to compare.
      - ./docker-compose.yml:/etc/hydration-neckwork/docker-compose.yml:ro
      - ./scripts/ingestion-supervisor.sh:/usr/local/bin/ingestion-supervisor.sh:ro
    working_dir: /etc/hydration-neckwork

  # Blockscout's contract-verification microservice: compiles submitted
  # standard-json and compares against the bytecode the api hands it. Stateless
  # apart from a compiler cache, and completely chain-agnostic, which is why it
  # works for Hydration without knowing chain 222222. Internal network only —
  # the public surface is the api's Sourcify-compatible translation layer.
  #
  # Config is deserialized with deny_unknown_fields: a typo in any
  # SMART_CONTRACT_VERIFIER__* variable PANICS at startup rather than warning.
  smart-contract-verifier:
    <<: *service
    image: ghcr.io/blockscout/smart-contract-verifier:v1.10.6
    container_name: hydration-neckwork-smart-contract-verifier
    environment:
      # 2 MiB default is below a real project's standard-json input.
      - SMART_CONTRACT_VERIFIER__SERVER__HTTP__MAX_BODY_SIZE=33554432
      # Defaults to true and pulls two extra compiler lists on startup.
      - SMART_CONTRACT_VERIFIER__ZKSYNC_SOLIDITY__ENABLED=false
      # sourcify.dev does not know chain 222222, so its sourcify route is
      # useless here; the api implements that protocol itself.
      - SMART_CONTRACT_VERIFIER__SOURCIFY__ENABLED=false
    volumes:
      # Named volume, not a bind mount: the container runs as uid 1001 and would
      # fail to populate a host-owned directory. A FRESH volume still mounts
      # root-owned (the image has no /tmp/solidity-compilers to inherit from),
      # so a new deployment needs a one-time
      #   docker compose exec -u root smart-contract-verifier chown 1001:1001 /tmp/solidity-compilers
      # or every verification fails with "fetching evm compiler: Permission denied".
      - solidity_compilers:/tmp/solidity-compilers

  # Nightly Parquet export of the contract verification tables — api-authored
  # state a projection rebuild cannot regenerate (005_contracts.sql). Mirrors
  # user-backup with its own script and volume; see ops/backup-contract-tables.sh
  # for the export/retention/restore procedure.
  contract-backup:
    <<: *service
    build: ./clickhouse
    container_name: hydration-neckwork-contract-backup
    entrypoint: ["/bin/sh", "/backup-contract-tables.sh"]
    volumes:
      - ./ops/backup-contract-tables.sh:/backup-contract-tables.sh:ro
      - contract_backups:/backups
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully

  api:
    <<: *service
    build:
      context: ./api
      dockerfile: Dockerfile
    # Pinned, like every other service on this image. Without it the tag is
    # `${COMPOSE_PROJECT_NAME}-api`, so under any project name but the default a
    # rebuild of `api` leaves derivations/api-public/api-data on the stale tag.
    image: hydration-neckwork-api
    container_name: hydration-neckwork-api
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Per-group page/window logging for the notification lanes; off unless set.
      - NOTIFICATIONS_DEBUG=${NOTIFICATIONS_DEBUG:-}
      # One-off catch-up knob: how far behind the head a notification tick may look
      # (default 600). Wide only for a deliberate replay after a lane lost a stretch.
      - NOTIFICATIONS_MAX_WINDOW_BLOCKS=${NOTIFICATIONS_MAX_WINDOW_BLOCKS:-}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      # Live money-market reads use a Hydration RPC reachable from the container.
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      # Runtime block-count constants that must remain operator-overridable at a
      # cadence migration. Empty preserves the code/metadata fallback.
      - SECURITY_FUSE_PERIOD_BLOCKS=${SECURITY_FUSE_PERIOD_BLOCKS:-}
      - GIGA_UNBONDING_BLOCKS=${GIGA_UNBONDING_BLOCKS:-}
      - EXPLORER_OCELLOIDS_URL=${EXPLORER_OCELLOIDS_URL:-https://api.ocelloids.net}
      - EXPLORER_OCELLOIDS_TOKEN=${EXPLORER_OCELLOIDS_TOKEN:-}
      # Defuse 1Click, which resolves the destination leg of a cross-chain swap
      # (which asset, which recipient, how much arrived — none of it is on chain).
      # Unset leaves the resolution off and the swap shows its on-chain half only.
      - ONE_CLICK_BASE_URL=${ONE_CLICK_BASE_URL:-https://1click.chaindefuser.com}
      - ONE_CLICK_TOKEN=${ONE_CLICK_TOKEN:-}
      # Reference USD candles for cross-chain destinations that do not trade here.
      - KRAKEN_BASE_URL=${KRAKEN_BASE_URL:-https://api.kraken.com/0/public}
      # Transaction-pool rows (dry-run projections of transactions no block
      # carries yet). OFF unless set to on/1/true/yes: it needs a node that
      # answers author_pendingExtrinsics and the DryRunApi, and what it shows
      # are projections rather than chain facts.
      - EXPLORER_MEMPOOL=${EXPLORER_MEMPOOL:-}
      # Contract verification: compile-and-compare backend + the chain id the
      # Sourcify-compatible routes answer for.
      - SMART_CONTRACT_VERIFIER_URL=${SMART_CONTRACT_VERIFIER_URL:-http://smart-contract-verifier:8050}
      - EVM_CHAIN_ID=${EVM_CHAIN_ID:-222222}
      # Notifications. All optional: with no VAPID pair Web Push registration
      # answers 503, with no bot token the Telegram long-poll loop never starts,
      # and both simply report as unconfigured to the client. Never commit
      # populated values — these are credentials.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      # Origin the links inside a notification point at, and the evaluator's
      # tick interval. EXPLORER_PUBLIC_URL is also the canonical origin every
      # absolute URL the SEO layer writes is built on — the <link rel=canonical>
      # on each page, every <loc> in the sitemaps, and the Sitemap line in
      # robots.txt — so pointing this at another host moves all of them.
      - EXPLORER_PUBLIC_URL=${EXPLORER_PUBLIC_URL:-https://hydration-explorer.neckwork.net}
      - NOTIFY_EVAL_MS=${NOTIFY_EVAL_MS:-}
      # The same, for the charts app served from its own host: its canonical
      # origin and the sitemap it advertises. The SHELL_URLs are where the head
      # renderer reads each app's built index.html from, on the internal network.
      - PREIS_PUBLIC_URL=${PREIS_PUBLIC_URL:-https://hydration-preis.neckwork.net}
      - EXPLORER_SHELL_URL=${EXPLORER_SHELL_URL:-http://hydration-neckwork-explorer-ui:80/index.html}
      - PREIS_SHELL_URL=${PREIS_SHELL_URL:-http://hydration-neckwork-preis-ui:80/index.html}
      # Data API control plane (routes/apiTokens.ts): the admin allowlist and
      # the default limits the admin page reports beside overrides. Must match
      # the api-data service's values.
      - ADMIN_ACCOUNT_IDS=${ADMIN_ACCOUNT_IDS:-}
      - DATA_API_DEFAULT_PER_MINUTE=${DATA_API_DEFAULT_PER_MINUTE:-}
      - DATA_API_DEFAULT_PER_DAY=${DATA_API_DEFAULT_PER_DAY:-}
      # Wormhole NTT backing check. Optional origin-chain RPC map (JSON keyed by
      # Wormhole chain id) for reading the custody that backs the bridged supply;
      # empty disables custody reads and the affected assets report as
      # unconfigured. Wormholescan resolves in-flight transfers; empty disables
      # it. Never commit populated values — the RPC map carries API keys.
      - WORMHOLE_ORIGIN_RPC_URLS=${WORMHOLE_ORIGIN_RPC_URLS:-}
      # Unset-only default (no colon): setting it EMPTY is the disable switch.
      - WORMHOLE_SCAN_URL=${WORMHOLE_SCAN_URL-https://api.wormholescan.io}
      # Read by governanceService for referendum links; the titles snapshotter
      # reads the same variable, and the two must name the same site.
      - SUBSQUARE_BASE_URL=${SUBSQUARE_BASE_URL:-https://hydration.subsquare.io}
      - EXPLORER_EXTRA_ATOKEN_UNDERLYING=${EXPLORER_EXTRA_ATOKEN_UNDERLYING:-}

  # Long-running recompute loop for the derivation jobs registered in
  # api/src/derivations/runner.ts (read models a plain materialized view can't
  # express). Same image/env as `api`; gated on schema-bootstrap like every
  # other schema consumer.
  derivations:
    <<: *service
    build:
      context: ./api
      dockerfile: Dockerfile
    image: hydration-neckwork-api
    container_name: hydration-neckwork-derivations
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    command: ["./node_modules/.bin/tsx", "src/derivations/runner.ts"]
    environment:
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - EXPLORER_OCELLOIDS_URL=${EXPLORER_OCELLOIDS_URL:-https://api.ocelloids.net}
      - EXPLORER_OCELLOIDS_TOKEN=${EXPLORER_OCELLOIDS_TOKEN:-}
      # Defuse 1Click, which resolves the destination leg of a cross-chain swap
      # (which asset, which recipient, how much arrived — none of it is on chain).
      # Unset leaves the resolution off and the swap shows its on-chain half only.
      - ONE_CLICK_BASE_URL=${ONE_CLICK_BASE_URL:-https://1click.chaindefuser.com}
      - ONE_CLICK_TOKEN=${ONE_CLICK_TOKEN:-}
      # Reference USD candles for cross-chain destinations that do not trade here.
      - KRAKEN_BASE_URL=${KRAKEN_BASE_URL:-https://api.kraken.com/0/public}
      - EXPLORER_EXTRA_ATOKEN_UNDERLYING=${EXPLORER_EXTRA_ATOKEN_UNDERLYING:-}

  # Public REST API (AGENTS.md § Public API):
  # the versioned /v1 + /rest surface for the Hydration UI and external feeds.
  # Its own process on the same image/env as `api`, so public traffic never
  # shares an event loop, in-process cache or rate-limit budget with the
  # explorer; gated on schema-bootstrap like every other schema consumer.
  api-public:
    <<: *service
    build:
      context: ./api
      dockerfile: Dockerfile
    image: hydration-neckwork-api
    container_name: hydration-neckwork-api-public
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    command: ["./node_modules/.bin/tsx", "src/public/server.ts"]
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      # Batch filters travel in the query string, so a supported request line is
      # kilobytes long — `/v1/pools/xyk/volumes?pools=` takes a list of 67-byte
      # pool accounts whose realistic maximum is the whole XYK venue (measured 289
      # pools, ~19.4 kB). Node's 16 kB default made that a bare 431 with no error
      # envelope from ~250 ids up, independently of the edge's own limit (raised
      # alongside in public-nginx/nginx.conf). 32 kB carries ~485 ids. Set only for
      # this service: the explorer API takes no such list.
      - NODE_OPTIONS=--max-http-header-size=32768
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      # Published by /rest/service/metadata. Set to "false" on a host that serves
      # a lagging copy, so a consumer's provider failover prefers another host.
      - PUBLIC_API_MASTER=${PUBLIC_API_MASTER:-true}
      # Same asset-registry snapshot as `api` (aToken aliases feed /v1/assets).
      - EXPLORER_EXTRA_ATOKEN_UNDERLYING=${EXPLORER_EXTRA_ATOKEN_UNDERLYING:-}
      # XCM volume for /hydration-web/v1/stats, from the same Ocelloids account the
      # explorer's journey enrichment uses. Without the token that one field is
      # served as null; the rest of the response is unaffected.
      - EXPLORER_OCELLOIDS_URL=${EXPLORER_OCELLOIDS_URL:-https://api.ocelloids.net}
      - EXPLORER_OCELLOIDS_TOKEN=${EXPLORER_OCELLOIDS_TOKEN:-}
      # Defuse 1Click, which resolves the destination leg of a cross-chain swap
      # (which asset, which recipient, how much arrived — none of it is on chain).
      # Unset leaves the resolution off and the swap shows its on-chain half only.
      - ONE_CLICK_BASE_URL=${ONE_CLICK_BASE_URL:-https://1click.chaindefuser.com}
      - ONE_CLICK_TOKEN=${ONE_CLICK_TOKEN:-}
      # Reference USD candles for cross-chain destinations that do not trade here.
      - KRAKEN_BASE_URL=${KRAKEN_BASE_URL:-https://api.kraken.com/0/public}

  # Data API (~/.g/hydraken-api-concept.md): the token-authenticated /v1 REST
  # surface for external developers at hydration-data.neckwork.net. Fourth
  # process on the shared api image; no RPC access needed, and deliberately NO
  # nginx micro-cache in front (a URI-keyed shared cache is unsafe for
  # authenticated responses, and per-user metering must see every request) —
  # the edge proxies straight to this container. Token CRUD lives on the
  # explorer `api` (control plane); this process only reads user_api_tokens/
  # user_api_limits and writes user_api_usage.
  api-data:
    <<: *service
    build:
      context: ./api
      dockerfile: Dockerfile
    image: hydration-neckwork-api
    container_name: hydration-neckwork-api-data
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    command: ["./node_modules/.bin/tsx", "src/data/server.ts"]
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - DATA_API_PORT=3000
      # Admin wallet accounts (comma-separated 0x-64-hex): exempt from rate
      # limits here; the same list gates the admin routes on `api`.
      - ADMIN_ACCOUNT_IDS=${ADMIN_ACCOUNT_IDS:-}
      # Per-account defaults when user_api_limits has no override. Must match
      # what `api` reports on the admin page (same variables there).
      - DATA_API_DEFAULT_PER_MINUTE=${DATA_API_DEFAULT_PER_MINUTE:-}
      - DATA_API_DEFAULT_PER_DAY=${DATA_API_DEFAULT_PER_DAY:-}
      # 401 context / docs links.
      - DATA_API_PUBLIC_URL=${DATA_API_PUBLIC_URL:-}
      - EXPLORER_PUBLIC_URL=${EXPLORER_PUBLIC_URL:-}
      - EXPLORER_EXTRA_ATOKEN_UNDERLYING=${EXPLORER_EXTRA_ATOKEN_UNDERLYING:-}

  # MCP server (AGENTS.md § MCP server): the
  # Model Context Protocol endpoint for LLM agents at hydration-mcp.neckwork.net.
  # Fifth process on the shared api image, and the only one that never touches
  # ClickHouse — it reads the explorer `api` over HTTP inside this network and
  # reshapes the result, which is what guarantees a number here is the number
  # the Explorer page shows. No schema dependency and no micro-cache: responses
  # are anonymous, already cached in-process, and the edge proxies straight here.
  api-mcp:
    <<: *service
    build:
      context: ./api
      dockerfile: Dockerfile
    image: hydration-neckwork-api
    container_name: hydration-neckwork-api-mcp
    # Unconditional: compose only needs to start `api` first so the name
    # resolves. A health condition would couple this service's restarts to the
    # explorer's, and the boot probe already reports an upstream that is still
    # coming up without refusing to serve.
    depends_on:
      - api
    command: ["./node_modules/.bin/tsx", "src/mcp/server.ts"]
    ports:
      - "127.0.0.1:3004:3000"
    environment:
      - MCP_PORT=3000
      # This service's own origin. Every snippet on the getting-started page,
      # /mcp.json and /llms.txt name it, so it must be the address an agent can
      # actually reach — not the container.
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-https://hydration-mcp.neckwork.net}
      # Upstream: the explorer api by container name, whose in-process caches are
      # already warm for the live UI. Riding that warm cache is the point.
      - EXPLORER_API_URL=${EXPLORER_API_URL:-http://hydration-neckwork-api:3000}
      # Where the canonical link on every rendered record points, so an agent can
      # hand a human the page a figure came from.
      - EXPLORER_PUBLIC_URL=${EXPLORER_PUBLIC_URL:-https://hydration-explorer.neckwork.net}
      # Comma-separated bearer keys. Empty means open, which is the default
      # posture: every tool reads public chain data only, and the private
      # /user/ surface is unreachable from this process by construction.
      - MCP_ACCESS_KEYS=${MCP_ACCESS_KEYS:-}
      # Sized for the COLD upstream call, not the typical one: scoped activity
      # measured 38s on a first read and milliseconds on every one after.
      - MCP_UPSTREAM_TIMEOUT_MS=${MCP_UPSTREAM_TIMEOUT_MS:-60000}
      # In-flight upstream requests across all agents. The explorer routes are
      # unthrottled and have no per-caller isolation, so this bound plus
      # single-flight de-duplication is what stops an agent burst from
      # contending with the live UI for the same event loop.
      - MCP_MAX_UPSTREAM_CONCURRENCY=${MCP_MAX_UPSTREAM_CONCURRENCY:-6}
      # Slots carved OUT of that bound and reserved for the cheap reads (chain
      # status, the last blocks). Without them a burst of scoped-activity calls
      # holds every permit and "is the chain live?" waits behind a minute of
      # someone else's work — the answer an agent needs soonest, last.
      - MCP_UPSTREAM_CHEAP_LANE_SLOTS=${MCP_UPSTREAM_CHEAP_LANE_SLOTS:-2}
      # How long a call may wait for a permit before it is shed. Short on
      # purpose: an agent can act on a fast "busy, retry", and cannot act on an
      # answer that arrives after a minute in a queue.
      - MCP_UPSTREAM_QUEUE_TIMEOUT_MS=${MCP_UPSTREAM_QUEUE_TIMEOUT_MS:-5000}
      # How many calls may wait at once, so a burst is refused at the door
      # rather than growing a queue behind work that is already oversubscribed.
      - MCP_UPSTREAM_QUEUE_DEPTH=${MCP_UPSTREAM_QUEUE_DEPTH:-64}
      # Default per-URL response cache TTL; tools override it per call where the
      # upstream resource moves more slowly than the feed.
      - MCP_CACHE_TTL_MS=${MCP_CACHE_TTL_MS:-10000}
      # Hard cap on one rendered answer, with a truncation note. The tools render
      # to fit; this is the last guard on an agent's context window.
      - MCP_MAX_TEXT_CHARS=${MCP_MAX_TEXT_CHARS:-24000}

  # Micro-cache in front of api-public: URI-keyed, honors the app's per-route
  # Cache-Control, collapses concurrent misses into one upstream request. The
  # external reverse proxy (outside this repo) points the public hostname here,
  # never at api-public directly.
  api-public-nginx:
    <<: *service
    build:
      context: ./public-nginx
      dockerfile: Dockerfile
    container_name: hydration-neckwork-api-public-nginx
    depends_on:
      - api-public
    ports:
      - "127.0.0.1:8081:80"

  preis-ui:
    <<: *service
    build:
      context: ./preis-ui
      dockerfile: Dockerfile
      args:
        # Public URL of the Explorer UI, baked into the bundle at build time
        # (Vite). Set VITE_EXPLORER_URL in .env, then rebuild preis-ui.
        VITE_EXPLORER_URL: ${VITE_EXPLORER_URL:-}
    container_name: hydration-neckwork-preis-ui
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"

  explorer-ui:
    <<: *service
    build:
      context: ./explorer-ui
      dockerfile: Dockerfile
      args:
        # Public URL of the Preis price-chart UI, baked into the bundle at build time
        # (Vite). Set VITE_PREIS_URL in .env, then rebuild explorer-ui.
        VITE_PREIS_URL: ${VITE_PREIS_URL:-}
        # Browser-side EVM JSON-RPC for the contract tab (bytecode, eth_call).
        VITE_EVM_RPC_URL: ${VITE_EVM_RPC_URL:-}
    container_name: hydration-neckwork-explorer-ui
    depends_on:
      - api
    ports:
      - "127.0.0.1:5174:80"

volumes:
  clickhouse_data:
    name: ${CLICKHOUSE_VOLUME_NAME:-hydration-neckwork-clickhouse-data}
  user_backups:
  contract_backups:
  solidity_compilers:

networks:
  neckwork:
    name: hydration-neckwork-network
    driver: bridge

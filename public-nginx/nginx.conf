# Shared micro-cache in front of the public REST API (compose service
# `api-public`). Every /v1 and /rest response is anonymous and carries an
# explicit `public, max-age=…` from the app (api/src/public/cacheControl.ts),
# which nginx honors for entry lifetime — so N external consumers polling the
# same endpoint collapse to at most one upstream request per TTL and the
# API/ClickHouse load stays O(1) in the number of callers. Routes the app marks
# `no-store` (anything without a rule, and every non-200) are never stored here.
proxy_cache_path /var/cache/nginx/public_api levels=1:2 keys_zone=public_api_cache:10m max_size=200m inactive=15m use_temp_path=off;

server {
    listen 80;
    # Public-internet responses carry no server version.
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Use the unique container name, NOT a compose service alias: a co-located
    # project on the shared `common` docker network also runs services with
    # generic names, so an alias can round-robin onto the wrong container. The
    # container_name is unique. Resolved at request time (via `resolver` and a
    # variable) so replacing the upstream container does not need a reload.
    set $public_api_upstream hydration-neckwork-api-public:3000;

    # JSON API only — this container serves no files.
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json text/css text/javascript application/javascript;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # nginx compresses only for HTTP/1.1+ clients by default, and its own
    # proxy_pass defaults to HTTP/1.0 upstream. The external reverse proxy in
    # front of this container is such a hop, so accept 1.0 or every payload
    # reaches the public internet uncompressed.
    gzip_http_version 1.0;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    # Batch endpoints take their keys in the QUERY STRING, so a legitimate request
    # line is kilobytes long: 50 × 32-byte accounts on /v1/accounts/balances is
    # 3.4 kB, and `/v1/pools/xyk/volumes?pools=` accepts a list of pool ACCOUNTS
    # (67 bytes each) whose realistic maximum is the whole XYK venue — measured at
    # 289 pools, ~19.4 kB. The request line must fit in ONE of these buffers, so
    # nginx's 8 kB default answered 414 above ~120 pool ids. 32 kB carries ~485
    # ids, i.e. the full venue with room, and is allocated only for a connection
    # whose header actually exceeds client_header_buffer_size.
    large_client_header_buffers 4 32k;

    # nginx keeps the cache key AND the upstream response header block in one
    # proxy buffer, so at the 4 kB default a long URI either 502s
    # ("upstream sent too big header": the key left too little room for the
    # response's own headers) or silently drops out of the cache
    # ("proxy_buffer_size … is not enough for cache key" → passed through
    # uncached). Measured before this: the 50-account batch — the documented
    # MAXIMUM — sat ~66 bytes from the cliff, and the 51-account request that must
    # be a typed 400 was a deterministic 502 instead. 8 kB clears the whole
    # accounts contract with ~4.6 kB of header room to spare; the one route whose
    # keys are longer than that raises it further in its own location below.
    proxy_buffer_size 8k;
    # proxy_buffers holds the response BODY after that header buffer. nginx derives
    # proxy_busy_buffers_size from the LARGER of the two sizes, so raising only the
    # header buffer leaves the pair lopsided; matching them keeps the arithmetic
    # coherent and doubles body buffering from the 8 × 4 kB (one page) default to
    # 64 kB, which is a few kB of RAM per in-flight upstream read.
    proxy_buffers 8 8k;

    # `add_header` is inherited only when a location declares none of its own, so
    # each location below repeats the baseline header rather than losing it.

    location / {
        proxy_pass http://$public_api_upstream;
        proxy_cache public_api_cache;
        proxy_cache_methods GET HEAD;
        # Responses carry Access-Control-Allow-Origin: *, so every origin can
        # safely share one cached representation — the URI alone is the key.
        proxy_cache_key "$request_uri";
        # Collapse concurrent misses into ONE upstream fetch. Stale entries are
        # served here only while the upstream is actually failing, never while
        # updating: most routes under this default revalidate in milliseconds
        # against the app's in-process cache, and `use_stale updating` would put
        # a response of up to `inactive` age in front of the first caller after
        # an idle gap. That is the wrong trade for the 3–5 s liveness routes this
        # block carries (`/v1/status`, `/v1/prices/pair`, `/v1/trades*`), which
        # answer in 6–13 ms and whose whole value is being current. The handful
        # of routes where the recompute is genuinely slow opt into a background
        # refresh in their own blocks below.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 65s;
        proxy_cache_use_stale error timeout;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The one route whose documented filter is a list of 32-byte pool ACCOUNTS, so
    # its cache key alone can be ~20 kB — larger than the 8 kB header buffer above,
    # which would drop exactly the biggest requests out of the shared cache (nginx
    # answers them uncached and logs an error per request). 40 kB holds the full
    # XYK venue's key plus the response's own headers, so the request the old data
    # lake REQUIRED a pool list for is cached like every other one.
    #
    # It also refreshes in the background rather than making a caller wait. The
    # venue is one cache key in practice (11,249 of 11,261 omnipool requests are
    # `?period=24h`), and behind the sidecar the app's own in-process entry
    # expires on a different clock, so when both miss at once the request that
    # lands on the recompute pays for it: measured p50 4 ms against p95 1,017 ms
    # on omnipool volumes, i.e. a ~1 s stall for a few percent of callers — more
    # than the entire round-trip penalty of being far from Falkenstein, and it
    # lands on every region. Serving the stale entry while one background
    # subrequest refreshes it costs at most `inactive` (15 m) of age after a gap
    # longer than the zone keeps the entry, on a 24 h rolling aggregate.
    location ~ ^/v1/pools/[^/]+/volumes$ {
        proxy_pass http://$public_api_upstream;
        proxy_buffer_size 40k;
        proxy_buffers 8 40k;
        proxy_cache public_api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 65s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The other two single-key slow aggregates, refreshed off the critical path
    # for the same reason as the volumes block above. Both are one cache key for
    # the whole internet (`/v1/stats/platform` 9,200 requests → 1 key,
    # `/hydration-web/v1/stats` 2,158 → 1), so a background refresh serves every
    # caller and no request pays for it.
    #
    # Deliberately NOT extended to `/api/v1/fees/charts`, whose `startTime`
    # window makes its key effectively unique per request (9,267 distinct keys
    # across 10,827 requests): there is never a stale entry to serve, so its
    # ~790 ms p95 is a query cost to fix in the read model, not a cache setting.
    location ~ ^/(v1/stats/platform|hydration-web/v1/stats)$ {
        proxy_pass http://$public_api_upstream;
        proxy_cache public_api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 65s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Allow-listed upstream passthrough. These responses are cached in-process by
    # the app per upstream, with a per-upstream TTL and no failure ever stored,
    # so a URI-keyed shared cache here would be wrong.
    location ^~ /proxy/ {
        proxy_pass http://$public_api_upstream;
        proxy_cache off;
        # Upstream APIs are slower and less reliable than ClickHouse.
        proxy_read_timeout 30s;
        add_header X-Cache-Status "BYPASS";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Documentation surface: changes only on deploy, so a short shared TTL is
    # enough. proxy_cache_valid is the floor for the (rare) case where the
    # upstream sends no Cache-Control of its own.
    location = /openapi.json {
        proxy_pass http://$public_api_upstream;
        proxy_cache public_api_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_lock on;
        proxy_cache_valid 200 60s;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /docs {
        proxy_pass http://$public_api_upstream;
        proxy_cache public_api_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_lock on;
        proxy_cache_valid 200 60s;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

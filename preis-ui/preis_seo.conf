# Shared body of the API-rendered locations in nginx.conf. The proxy_pass itself
# stays in each location, because each maps to a different upstream path; what is
# shared is the part that must never be forgotten — the fallback.
proxy_set_header Host $host;

# Degrade fast: a chart must not wait on an unhealthy renderer.
proxy_connect_timeout 1s;
proxy_send_timeout 2s;
proxy_read_timeout 2s;
proxy_next_upstream off;

# Anything that is not a rendered answer becomes the static shell, which is what
# this host served before and what it serves everywhere else.
proxy_intercept_errors on;
error_page 404 500 502 503 504 = @spa;

# Shared, since the answer depends only on the path. No add_header here: one in
# this context would drop the headers inherited from the server block.
proxy_cache preis_seo_cache;
proxy_cache_key "preis-seo:$uri";
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_use_stale error timeout updating;
proxy_cache_valid 200 60s;

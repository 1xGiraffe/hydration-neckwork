<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Safari can't use SVG favicons — give it an ICO fallback (Chrome and
         Firefox still prefer the SVG above). The ICO is the bare glyph like
         the SVG — icon-192/512.png are tile-style PWA art (manifest only). -->
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030816" />
    <!-- Both names, deliberately: Chromium deprecated the apple- prefixed one
         and warns in the console, while iOS Safari still reads only that one.
         Dropping either costs standalone launch on one of the two platforms. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('preis-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Live price charts for Hydration assets — candles, volume and market stats for every trading pair, indexed from the chain." />
    <!-- One canonical URL for the whole app. Every pair and interval
         (/<base>-<quote>/<interval>) renders from this same shell and the pair
         is chosen client-side, so a crawler that runs no scripts receives one
         document whichever path it fetched; pointing them all at the root keeps
         it from indexing that document once per pair. -->
    <link rel="canonical" href="https://hydration-preis.neckwork.net/" />
    <meta property="og:title" content="Hydration Preis" />
    <meta property="og:description" content="Live price charts for Hydration assets — candles, volume and market stats for every trading pair, indexed from the chain." />
    <!-- Card scrapers resolve an image only as an absolute URL (X renders no
         image at all from a relative path), so both card images carry the host. -->
    <meta property="og:image" content="https://hydration-preis.neckwork.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hydration Preis price charts" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hydration Preis" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hydration Preis" />
    <meta name="twitter:description" content="Live price charts for Hydration assets — candles, volume and market stats for every trading pair, indexed from the chain." />
    <meta name="twitter:image" content="https://hydration-preis.neckwork.net/og-image.png" />
    <title>Hydration Preis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

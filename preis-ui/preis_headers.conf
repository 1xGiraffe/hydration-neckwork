# The preis host's browser hardening: this server is the one layer that sets these
# headers. Included at server level, and again in every location with an add_header
# of its own — nginx drops every inherited add_header in such a location, so one
# that did not include this file would serve its responses without them.
#
# Scripts run from this origin only: index.html's one inline script (the theme
# bootstrap) is allowed by its sha256, which the Dockerfile computes from the built
# index.html and writes over the placeholder — there is no 'unsafe-inline' for
# scripts. Inline styles stay allowed (React style props, the chart library).
# Every fetch and the live stream are same-origin (/api/). img-src names the hosts
# the app loads images from: the asset-metadata CDN (token and chain icons,
# src/utils/iconUrls.ts) and Discord's emoji CDN (trader icons); the screenshot
# watermark is a data: URL. An image from any other host is blocked until listed.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' __CSP_SCRIPT_HASH__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net https://cdn.discordapp.com; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Micro-cache for the API-rendered head, sitemap and robots.txt. This host had
# no proxy cache at all before — its API traffic is candles, which are per-window
# and not worth caching here — so the zone is declared with the small footprint
# those three answers need, not the explorer's.
proxy_cache_path /var/cache/nginx/seo levels=1:2 keys_zone=preis_seo_cache:1m max_size=16m inactive=15m use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # Use the unique container name, NOT the compose service alias `api`: a
    # co-located project on the shared `common` docker network also runs a
    # service named `api`, so `api:3000` round-robins between the two containers
    # (~50% of requests hit the wrong one -> 404). The container_name is unique.
    set $api_upstream hydration-neckwork-api:3000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # nginx compresses only for HTTP/1.1+ clients by default, and nginx's own
    # `proxy_pass` defaults to speaking HTTP/1.0 upstream. A front proxy that
    # does not raise `proxy_http_version` therefore gets every asset and every
    # API payload uncompressed (measured: 509 kB instead of 153 kB for the entry
    # chunk). This container is behind exactly such a hop, so accept 1.0.
    gzip_http_version 1.0;
    # Both JavaScript media types are listed because the `.js` mapping in
    # nginx's bundled mime.types changed to `text/javascript` upstream; the base
    # image is unpinned, so a rebuild must not silently drop JavaScript out of
    # gzip_types.
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Vite's generated assets are content-hashed and safe to cache immutably.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        # Font filenames are stable, so allow release updates to replace them.
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # A missing static resource must be a real 404, never the SPA document.
    location ~* \.(?:avif|css|eot|gif|html|ico|jpe?g|js|json|map|mp4|otf|pdf|png|svg|ttf|txt|webm|webmanifest|webp|woff2?|xml)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Server-sent head events (shared with the explorer): one long-lived stream
    # per tab, never buffered. X-Accel-Buffering is an nginx-internal control
    # header that each hop consumes WITHOUT forwarding, so the front proxy
    # would silently buffer the stream to death; pass it through explicitly so
    # every hop in front of us disables buffering too.
    location = /api/explorer/live {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass_header X-Accel-Buffering;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-chart <head>, its sitemap and its robots.txt all come from the API: a
    # client-rendered chart has one title for every pair otherwise, and a sitemap
    # only covers the host it is served from, so this host needs its own rather
    # than an entry in the explorer's. Any failure falls through to @spa, the
    # exact file this location serves today.
    location = /robots.txt {
        proxy_pass http://$api_upstream/seo/preis/robots.txt;
        include /etc/nginx/preis_seo.conf;
    }
    location = /sitemap.xml {
        proxy_pass http://$api_upstream/seo/preis/sitemap.xml;
        include /etc/nginx/preis_seo.conf;
    }
    location ~ ^/(0|[1-9][0-9]*)-(0|[1-9][0-9]*)(/[a-zA-Z0-9]+)?$ {
        proxy_pass http://$api_upstream/seo/preis/page$uri;
        include /etc/nginx/preis_seo.conf;
    }
    location = / {
        proxy_pass http://$api_upstream/seo/preis/page/;
        include /etc/nginx/preis_seo.conf;
    }

    location @spa {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

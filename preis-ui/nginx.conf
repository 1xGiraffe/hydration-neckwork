# Micro-cache for the API-rendered head, sitemap and robots.txt. This host had
# no proxy cache at all before — its API traffic is candles, which are per-window
# and not worth caching here — so the zone is declared with the small footprint
# those three answers need, not the explorer's.
proxy_cache_path /var/cache/nginx/seo levels=1:2 keys_zone=preis_seo_cache:1m max_size=16m inactive=15m use_temp_path=off;

# Per-client brake on /api/ (candles, indexer, market stats): a 900-request
# allowance on top of 60 a minute, so only a client averaging more than one request
# a second for over a quarter of an hour is ever refused. Replayed over 16 days of
# edge logs (2026-10-29 → 11-13) it would have refused nobody — even 30/min + 600
# would have — so this is purely a brake on a future crawl, sized to stay clear of
# every chart user. Same keying as the explorer's (explorer-ui/nginx.conf): the
# LAST X-Forwarded-For entry is the address the front proxy accepted the connection
# from; a request without one keys by its own address; private addresses and this
# host's own are exempt (an empty key is never limited).
map $http_x_forwarded_for $api_client {
    "~(?<api_client_last>[^,\s]+)\s*$" $api_client_last;
    default $remote_addr;
}
geo $api_client $api_client_exempt {
    default 0;
    127.0.0.0/8 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    # Deployment-specific exempt addresses (e.g. the server's own public address): an
    # empty file in the image, replaced by a local compose override where needed.
    include /etc/nginx/rate-exempt.local.conf;
}
map $api_client_exempt $preis_api_key {
    1 "";
    default $api_client;
}
limit_req_zone $preis_api_key zone=preis_api_sustained:20m rate=60r/m;
# Per-client cap on concurrent live streams (/api/explorer/live), the same eight the
# explorer host allows: a tab holds one, and one client cannot pin an unbounded
# number of upstream connections.
limit_conn_zone $preis_api_key zone=preis_live_conn:10m;

server {
    listen 80;
    root /usr/share/nginx/html;

    # CSP, nosniff, X-Frame-Options, Referrer-Policy and Permissions-Policy (see the
    # file). Every location below with an add_header of its own includes it again.
    # An upstream's own nosniff is hidden so a response never carries two (a
    # location's own proxy_hide_header replaces this one, so preis_seo.conf restates it).
    include /etc/nginx/preis_headers.conf;
    proxy_hide_header X-Content-Type-Options;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # Use the unique container name, NOT the compose service alias `api`: a
    # co-located project on the shared `common` docker network also runs a
    # service named `api`, so `api:3000` round-robins between the two containers
    # (~50% of requests hit the wrong one -> 404). The container_name is unique.
    set $api_upstream hydration-neckwork-api:3000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # nginx compresses only for HTTP/1.1+ clients by default, and nginx's own
    # `proxy_pass` defaults to speaking HTTP/1.0 upstream. A front proxy that
    # does not raise `proxy_http_version` therefore gets every asset and every
    # API payload uncompressed (measured: 509 kB instead of 153 kB for the entry
    # chunk). This container is behind exactly such a hop, so accept 1.0.
    gzip_http_version 1.0;
    # Both JavaScript media types are listed because the `.js` mapping in
    # nginx's bundled mime.types changed to `text/javascript` upstream; the base
    # image is unpinned, so a rebuild must not silently drop JavaScript out of
    # gzip_types.
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Vite's generated assets are content-hashed and safe to cache immutably.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/preis_headers.conf;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        # Font filenames are stable, so allow release updates to replace them.
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/preis_headers.conf;
        try_files $uri =404;
    }

    # A missing static resource must be a real 404, never the SPA document.
    location ~* \.(?:avif|css|eot|gif|html|ico|jpe?g|js|json|map|mp4|otf|pdf|png|svg|ttf|txt|webm|webmanifest|webp|woff2?|xml)$ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/preis_headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/preis_headers.conf;
        try_files /index.html =404;
    }

    # Server-sent head events (shared with the explorer): one long-lived stream
    # per tab, never buffered. X-Accel-Buffering is an nginx-internal control
    # header that each hop consumes WITHOUT forwarding, so the front proxy
    # would silently buffer the stream to death; pass it through explicitly so
    # every hop in front of us disables buffering too.
    location = /api/explorer/live {
        # See preis_live_conn at the top.
        limit_conn preis_live_conn 8;
        limit_conn_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass_header X-Accel-Buffering;
    }

    # The page-head renderer is reached by the page locations below, never through
    # /api/: called that way it would serve the app shell outside them.
    location ^~ /api/seo/ { return 404; }

    # The per-user api (login, sessions, lists, forum writes) belongs to the explorer
    # host alone; preis never signs anyone in, so it does not exist here.
    location ^~ /api/user/ { return 404; }

    location ^~ /api/ {
        # See preis_api_sustained at the top.
        limit_req zone=preis_api_sustained burst=900 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A refused /api/ request: the API's own JSON error shape, and when to retry.
    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        include /etc/nginx/preis_headers.conf;
        return 429 '{"error":"Too many requests; slow down and retry later"}';
    }

    # Per-chart <head>, its sitemap and its robots.txt all come from the API: a
    # client-rendered chart has one title for every pair otherwise, and a sitemap
    # only covers the host it is served from, so this host needs its own rather
    # than an entry in the explorer's. Any failure falls through to @spa, the
    # exact file this location serves today.
    location = /robots.txt {
        proxy_pass http://$api_upstream/seo/preis/robots.txt;
        include /etc/nginx/preis_seo.conf;
    }
    location = /sitemap.xml {
        proxy_pass http://$api_upstream/seo/preis/sitemap.xml;
        include /etc/nginx/preis_seo.conf;
    }
    # The page's path is set by rewrite rather than written into proxy_pass, which
    # would send the decoded $uri unescaped (see the explorer's seo_page.conf); this
    # location's pattern admits no such character today, and the form keeps it so.
    location ~ ^/(0|[1-9][0-9]*)-(0|[1-9][0-9]*)(/[a-zA-Z0-9]+)?$ {
        rewrite ^ /seo/preis/page$uri break;
        proxy_pass http://$api_upstream;
        include /etc/nginx/preis_seo.conf;
    }
    location = / {
        proxy_pass http://$api_upstream/seo/preis/page/;
        include /etc/nginx/preis_seo.conf;
    }

    location @spa {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/preis_headers.conf;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
